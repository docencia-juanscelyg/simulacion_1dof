name: jazzy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:noble
    env:
      ROS_DISTRO: jazzy
      WS: /ros_ws
    steps:
      - name: Repo checkout
        uses: actions/checkout@v6
      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@0.7.15
        with:
          required-ros-distributions: jazzy
      - name: build and test
        uses: ros-tooling/action-ros-ci@0.4.6
        with:
          package-name: simulacion_1dof
          target-ros2-distro: jazzy
          colcon-defaults: |
            {
              "build": {
                "packages-up-to": true
              }
            }

      - name: Check xacro model
        working-directory: ${{ env.WS }}
        run: |
          source install/setup.bash
          xacro $(ros2 pkg prefix simulacion_1dof)/share/simulacion_1dof/robots/robot.urdf.xacro > /tmp/robot.urdf
          echo "URDF generated: $(wc -l < /tmp/robot.urdf) lines"
